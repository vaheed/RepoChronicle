name: Compose

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create local env file
        run: cp .env.example .env
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build all service images
        run: docker compose build
      - name: Start stack and smoke-test readiness
        run: sh scripts/smoke.sh
      - name: Stop stack and remove test volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
