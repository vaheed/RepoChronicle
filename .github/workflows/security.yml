name: Security and License Policy

on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-and-license-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and optional runtime integrations
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,channels,local-embeddings]"
      - name: Check licenses of installed Python distributions
        run: python scripts/check_licenses.py
      - name: Audit known Python dependency vulnerabilities
        run: pip-audit
