name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg17-bookworm
        env:
          POSTGRES_DB: repochronicle_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d repochronicle_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      RC_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/repochronicle_test
      RC_VALKEY_URL: redis://localhost:6379/0
      RC_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and all runtime connector/embedding extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,channels,local-embeddings]"
      - name: Repository language and link hygiene
        run: python scripts/check_english_only.py
      - name: Lint
        run: ruff check .
      - name: Formatting
        run: ruff format --check .
      - name: Type check
        run: mypy src
      - name: Apply migrations
        run: python -m repochronicle.migrations.cli upgrade
      - name: Tests
        run: pytest -q
      - name: Security lint
        run: bandit -q -r src

  dependency-and-license-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and optional runtime integrations
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,channels,local-embeddings]"
      - name: Check licenses of installed Python distributions
        run: python scripts/check_licenses.py
      - name: Audit known Python dependency vulnerabilities
        run: pip-audit

  compose-validate:
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'push' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Create local env file
        run: cp .env.example .env
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build all service images
        run: docker compose build
      - name: Start stack and smoke-test readiness
        run: sh scripts/smoke.sh
      - name: Stop stack and remove test volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
