security:
  fail_closed_on_unknown_source_permissions: true
  authorize_before_retrieval: true
  treat_retrieved_text_as_untrusted: true
  execute_repository_code: false
  write_to_repositories: false
  expose_secret_values: false

context:
  max_context_chars: 24000
  max_items: 12
  max_items_per_source: 5
  reserve_answer_tokens: true
  require_source_citations: true
  disclose_stale_index: true

retention:
  raw_webhook_payloads: false
  default_chat_retention_days: 180
  allow_per_tenant_override: true
  delete_derived_embeddings_on_source_deletion: true

chat_response:
  default_mode: mention_only
  proactive_enabled: false
  deduplicate_replies: true
  per_channel_rate_limit_per_minute: 6
  quiet_hours_enabled: false
