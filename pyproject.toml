[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "repochronicle"
version = "0.1.0"
description = "Open-source project intelligence for code, Git activity, and team conversations"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "RepoChronicle contributors" }]
keywords = [
  "code-intelligence",
  "codebase-knowledge",
  "project-intelligence",
  "engineering-activity",
  "self-hosted",
  "open-source",
  "repository",
  "mcp",
  "rag",
  "gitlab",
  "github",
  "telegram",
  "discord",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "asyncpg>=0.30,<1",
  "redis>=5.2,<7",
  "mcp>=1.12,<2",
]

[project.optional-dependencies]
channels = [
  "aiogram>=3.20,<4",
  "discord.py>=2.5,<3",
]
local-embeddings = [
  "fastembed>=0.7,<1",
]
training = [
  "transformers>=4.50,<6",
  "trl>=0.17,<1",
  "peft>=0.15,<1",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "bandit>=1.8,<2",
  "pip-audit>=2.8,<3",
  "pip-licenses>=5,<6",
]

[project.scripts]
repochronicle = "repochronicle.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repochronicle"]

[tool.hatch.build.targets.wheel.force-include]
"migrations/001_foundation.sql" = "repochronicle/migrations/sql/001_foundation.sql"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["repochronicle"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["repochronicle"]
strict = true
warn_unreachable = true
show_error_codes = true

[tool.coverage.run]
branch = true
source = ["repochronicle"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
